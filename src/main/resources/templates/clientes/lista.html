<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clientes | Aluguel de carros</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="cabecalho">
    <a class="marca" th:href="@{/clientes}">ViaCar</a>
    <span>Gestão de aluguel de carros</span>
</header>
<main class="container">
    <div class="titulo-acao">
        <div>
            <p class="rotulo">Sprint 2 · CRUD MVC</p>
            <h1>Clientes</h1>
            <p>Dados utilizados na análise financeira dos pedidos.</p>
        </div>
        <a class="botao principal" th:href="@{/clientes/novo}">Cadastrar cliente</a>
    </div>

    <div class="alerta sucesso" th:if="${mensagem}" th:text="${mensagem}"></div>

    <section class="vazio" th:if="${#lists.isEmpty(clientes)}">
        <h2>Nenhum cliente cadastrado</h2>
        <p>Cadastre o primeiro contratante para iniciar.</p>
    </section>

    <section class="grade-clientes" th:unless="${#lists.isEmpty(clientes)}">
        <a class="cartao" th:each="cliente : ${clientes}"
           th:href="@{/clientes/{id}(id=${cliente.id})}">
            <span class="avatar" th:text="${#strings.substring(cliente.nome, 0, 1)}">L</span>
            <span>
                <strong th:text="${cliente.nome}">Nome</strong>
                <small th:text="|CPF ${cliente.cpf}|">CPF</small>
                <small th:text="${cliente.profissao}">Profissão</small>
            </span>
            <span class="seta">→</span>
        </a>
    </section>
</main>
</body>
</html>
