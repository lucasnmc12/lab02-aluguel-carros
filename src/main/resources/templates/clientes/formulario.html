<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo + ' | Aluguel de carros'}">Cliente</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="cabecalho">
    <a class="marca" th:href="@{/clientes}">ViaCar</a>
    <span>Gestão de aluguel de carros</span>
</header>
<main class="container estreito">
    <a class="voltar" th:href="@{/clientes}">← Voltar aos clientes</a>
    <p class="rotulo">Dados do contratante</p>
    <h1 th:text="${titulo}">Novo cliente</h1>

    <form class="formulario" method="post" th:action="${acao}" th:object="${clienteForm}">
        <div class="alerta erro" th:if="${#fields.hasGlobalErrors()}"
             th:each="erro : ${#fields.globalErrors()}" th:text="${erro}"></div>

        <section class="painel">
            <h2>Identificação</h2>
            <div class="grade-formulario">
                <label class="campo largo">Nome completo
                    <input type="text" th:field="*{nome}" maxlength="120" autocomplete="name">
                    <small class="erro-campo" th:errors="*{nome}"></small>
                </label>
                <label class="campo">CPF
                    <input type="text" th:field="*{cpf}" maxlength="14" placeholder="000.000.000-00">
                    <small class="erro-campo" th:errors="*{cpf}"></small>
                </label>
                <label class="campo">RG
                    <input type="text" th:field="*{rg}" maxlength="20">
                    <small class="erro-campo" th:errors="*{rg}"></small>
                </label>
                <label class="campo largo">Endereço
                    <input type="text" th:field="*{endereco}" maxlength="200" autocomplete="street-address">
                    <small class="erro-campo" th:errors="*{endereco}"></small>
                </label>
                <label class="campo largo">Profissão
                    <input type="text" th:field="*{profissao}" maxlength="100">
                    <small class="erro-campo" th:errors="*{profissao}"></small>
                </label>
                <label class="campo largo" th:if="${titulo == 'Novo cliente'}">Senha de acesso (mínimo 8 caracteres)
                    <input type="password" th:field="*{senha}" minlength="8" autocomplete="new-password">
                    <small class="erro-campo" th:errors="*{senha}"></small>
                </label>
            </div>
        </section>

        <section class="painel">
            <div class="secao-cabecalho">
                <div>
                    <h2>Empregadores e rendimentos</h2>
                    <p>Informe até três. Deixe os dois campos vazios quando não houver empregador.</p>
                </div>
                <span class="limite">máximo 3</span>
            </div>
            <div class="empregador" th:each="empregador, item : *{empregadores}">
                <strong th:text="|Empregador ${item.count}|">Empregador 1</strong>
                <label class="campo">Nome da entidade
                    <input type="text" th:field="*{empregadores[__${item.index}__].nome}" maxlength="120">
                </label>
                <label class="campo">Rendimento mensal (R$)
                    <input type="number" min="0" step="0.01"
                           th:field="*{empregadores[__${item.index}__].rendimento}">
                    <small class="erro-campo"
                           th:errors="*{empregadores[__${item.index}__].rendimento}"></small>
                </label>
            </div>
        </section>

        <div class="acoes">
            <a class="botao secundario" th:href="@{/clientes}">Cancelar</a>
            <button class="botao principal" type="submit">Salvar cliente</button>
        </div>
    </form>
</main>
</body>
</html>
