<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${cliente.nome + ' | Aluguel de carros'}">Cliente</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="cabecalho">
    <a class="marca" th:href="@{/clientes}">ViaCar</a>
    <span>Gestão de aluguel de carros</span>
</header>
<main class="container estreito">
    <a class="voltar" th:href="@{/clientes}">← Voltar aos clientes</a>
    <a class="voltar" th:href="@{/pedidos}">Ver meus pedidos →</a>
    <div class="alerta sucesso" th:if="${mensagem}" th:text="${mensagem}"></div>
    <div class="perfil">
        <span class="avatar grande" th:text="${#strings.substring(cliente.nome, 0, 1)}">L</span>
        <div>
            <p class="rotulo">Cliente #<span th:text="${cliente.id}">1</span></p>
            <h1 th:text="${cliente.nome}">Nome</h1>
            <p th:text="${cliente.profissao}">Profissão</p>
        </div>
    </div>

    <section class="painel detalhes">
        <h2>Dados cadastrais</h2>
        <dl>
            <div><dt>CPF</dt><dd th:text="${cliente.cpf}">CPF</dd></div>
            <div><dt>RG</dt><dd th:text="${cliente.rg}">RG</dd></div>
            <div class="largo"><dt>Endereço</dt><dd th:text="${cliente.endereco}">Endereço</dd></div>
        </dl>
    </section>

    <section class="painel">
        <h2>Empregadores e rendimentos</h2>
        <p th:if="${#lists.isEmpty(cliente.empregadores)}">Nenhum empregador informado.</p>
        <div class="linha-empregador" th:each="empregador : ${cliente.empregadores}">
            <strong th:text="${empregador.nome}">Empresa</strong>
            <span th:text="${#numbers.formatCurrency(empregador.rendimento)}">R$ 0,00</span>
        </div>
    </section>

    <div class="acoes entre">
        <form method="post" th:action="@{/clientes/{id}/excluir(id=${cliente.id})}"
              onsubmit="return confirm('Excluir este cliente?');">
            <button class="botao perigo" type="submit">Excluir</button>
        </form>
        <a class="botao principal" th:href="@{/clientes/{id}/editar(id=${cliente.id})}">Editar cliente</a>
    </div>
</main>
</body>
</html>
